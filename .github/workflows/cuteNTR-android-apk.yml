name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android 14 APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the obsolete "tools" SDK package.
          # Install only platform-tools here; the required API/NDK packages
          # are installed explicitly in the next step.
          packages: platform-tools

      - name: Install Android 14 build tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuteNTR-android-14-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

name: NTR Viewer HR Android APK
# Also builds the in-app layout editor feature branch.

on:
  push:
    branches: [main, android-screen-layout-editor]
    paths:
      - 'android-port/**'
      - '.github/workflows/ntrviewer-hr-android.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        name: Check out Citrus Stream HR

      - uses: actions/setup-java@v5
        name: Set up Java
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        name: Set up Android SDK
        with:
          # Avoid the retired "tools" SDK package requested by the action default.
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Verify vendored NTR Viewer HR revision
        run: |
          test "$(cat android-port/upstream/.citrus-upstream-commit)" = "930f194d754141517fc247e9ce8e8392fbf70691"

      - name: Fetch SDL 3.4.20
        run: |
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git .build-sdl
          mkdir -p android-port/.build-sdl-java
          cp -R .build-sdl/android-project/app/src/main/java/org android-port/.build-sdl-java/

      - name: Verify Android source adaptations
        run: python3 android-port/app/src/main/cpp/apply_android.py

      - uses: gradle/actions/setup-gradle@v6
        name: Set up Gradle
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Build arm64 APK
        run: gradle -p android-port --no-daemon assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        name: Upload APK
        with:
          name: Citrus-Stream-HR-Android-debug
          path: android-port/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

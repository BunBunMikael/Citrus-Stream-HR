name: NTR Viewer HR Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-port/**'
      - '.github/workflows/ntrviewer-hr-android.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Citrus Stream HR
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Vendor the exact uploaded NTR Viewer HR source revision
        run: |
          if [ ! -f android-port/upstream/main.c ]; then
            git clone https://github.com/xzn/ntrviewer-hr.git .build-ntr
            git -C .build-ntr checkout 930f194d754141517fc247e9ce8e8392fbf70691
            test "$(git -C .build-ntr rev-parse HEAD)" = "930f194d754141517fc247e9ce8e8392fbf70691"
            mkdir -p android-port/upstream
            cp -a .build-ntr/. android-port/upstream/
            rm -rf android-port/upstream/.git
            printf '%s\\n' '930f194d754141517fc247e9ce8e8392fbf70691' > android-port/upstream/.citrus-upstream-commit
            python3 android-port/app/src/main/cpp/apply_android.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android-port/upstream
            git commit -m "Vendor NTR Viewer HR source for Android port"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fetch SDL 3.4.20
        run: |
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git .build-sdl
          mkdir -p android-port/.build-sdl-java
          cp -R .build-sdl/android-project/app/src/main/java/org android-port/.build-sdl-java/

      - name: Verify Android-specific source adaptations
        run: python3 android-port/app/src/main/cpp/apply_android.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build arm64 APK
        run: gradle -p android-port --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Citrus-Stream-HR-Android-debug
          path: android-port/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

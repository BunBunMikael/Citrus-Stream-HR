buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

 
// FFmpegKit dependency substitution must be global because the retired
// coordinate is declared by the ffmpeg-kit-react-native subproject.
allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module("com.arthenica:ffmpeg-kit-https:6.0-2"))
                .using(module("dev.ffmpegkit-maintained:ffmpeg-kit-https:6.0.3"))
        }
    }
}

// FFmpegKit's replacement artifact does not bring SmartException transitively.
// Add the runtime dependency to the Android app, where FFmpegKit is consumed.
subprojects {
    afterEvaluate {
        if (project.path == ":app") {
            dependencies.add("implementation", "com.arthenica:smart-exception-java:0.2.1")
        }
    }
}
